<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="spotify-setlist-generator logo">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#1ED7C8"/>
    </linearGradient>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#background)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="3"/>

  <!-- The setlist -->
  <g fill="url(#accent)">
    <circle cx="62" cy="64" r="8"/>
    <rect x="82" y="56" width="118" height="16" rx="8"/>
    <circle cx="62" cy="100" r="8" opacity="0.85"/>
    <rect x="82" y="92" width="86" height="16" rx="8" opacity="0.85"/>
    <circle cx="62" cy="136" r="8" opacity="0.7"/>
    <rect x="82" y="128" width="62" height="16" rx="8" opacity="0.7"/>
    <circle cx="62" cy="172" r="8" opacity="0.55"/>
    <rect x="82" y="164" width="34" height="16" rx="8" opacity="0.55"/>
  </g>

  <!-- …turned into music -->
  <circle cx="178" cy="182" r="46" fill="url(#accent)"/>
  <g fill="#121212">
    <path d="M163 160 L201 151 V161 L163 170 Z"/>
    <rect x="163" y="160" width="6" height="40"/>
    <rect x="195" y="151" width="6" height="40"/>
    <ellipse cx="160" cy="201" rx="10" ry="8" transform="rotate(-20 160 201)"/>
    <ellipse cx="192" cy="192" rx="10" ry="8" transform="rotate(-20 192 192)"/>
  </g>
</svg>
